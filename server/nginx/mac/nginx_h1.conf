# Mac local config: nginx_h1.conf
# Runs as current user, no root required.
worker_processes 1;
error_log /tmp/eec_nginx_error.log warn;
pid /tmp/eec_nginx.pid;

events { worker_connections 512; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;

    server {
        listen 8080;
        root /Users/hassaanali/coding-workspace/energy-eff-streaming/server/assets;

        location /bulk/ { autoindex off; }
        location /hls/plain/ {
            add_header Cache-Control no-cache;
            types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        }
        location /hls.key { alias /Users/hassaanali/coding-workspace/energy-eff-streaming/server/assets/../tls/hls.key; }
    }
}
