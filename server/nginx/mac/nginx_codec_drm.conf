# Mac local config: nginx_codec_drm.conf
# Used exclusively by orchestrator_codec_drm.py.
# Serves bulk downloads at a rate-capped 10 MB/s so powermetrics captures
# multiple 500ms samples (loopback would otherwise finish in <0.2s → 0 samples).
# Also serves new HLS codec/DRM variant directories and a mock license endpoint.
worker_processes 1;
error_log /tmp/eec_nginx_error.log warn;
pid /tmp/eec_nginx.pid;

events { worker_connections 512; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;

    server {
        listen 8080;
        root /Users/hassaanali/coding-workspace/energy-eff-streaming/server/assets;

        # Rate-limited bulk: 10 MB/s → ~9 s for a 90 MB file → ~18 powermetrics samples
        location /bulk/ {
            autoindex off;
            limit_rate 10m;
        }

        # Plain TS (existing) + new fMP4 variants
        location /hls/ {
            add_header Cache-Control no-cache;
            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
                video/mp4                      mp4 m4s;
                application/octet-stream       key bin;
            }
        }

        # Mock license endpoint: serves raw 16-byte AES key files
        # aes128.bin → AES-128-CBC key (for standard HLS encryption)
        # cenc.bin   → key used for CTR-mode decrypt emulating CENC/Widevine
        # cbcs.bin   → key used for CBC-mode decrypt emulating CBCS/PlayReady
        location /keys/ {
            add_header Cache-Control no-store;
            default_type application/octet-stream;
        }

        # Legacy key path kept for existing encrypted/ HLS tests
        location /hls.key {
            alias /Users/hassaanali/coding-workspace/energy-eff-streaming/server/tls/hls.key;
        }
    }
}
