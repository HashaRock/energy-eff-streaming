# HTTP/3 (QUIC) — requires nginx built with --with-http_v3_module and BoringSSL/quiche.
# Build instructions: https://nginx.org/en/docs/quic.html
# The quic.nginx.org source drop includes BoringSSL and QUIC support.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    access_log off;

    server {
        # Listen on both TCP (for TLS handshake) and UDP (QUIC)
        listen 8443 ssl;
        listen 8443 quic reuseport;
        server_name _;

        ssl_certificate     /opt/eec/server/tls/server.crt;
        ssl_certificate_key /opt/eec/server/tls/server.key;

        # HTTP/3 requires TLSv1.3
        ssl_protocols TLSv1.3;

        http2 on;
        http3 on;
        http3_hq off;

        # Advertise HTTP/3 support to clients
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;
        add_header QUIC-Status $quic always;

        quic_retry on;

        root /opt/eec/server/assets;

        location /bulk/ {
            autoindex off;
        }

        location /hls/ {
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        location /hls.key {
            alias /opt/eec/server/tls/hls.key;
        }

        location /status {
            stub_status;
        }
    }
}
