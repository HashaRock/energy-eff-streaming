worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Disable access log during experiments to avoid I/O contamination
    access_log off;

    server {
        listen 8080;
        server_name _;

        root /opt/eec/server/assets;

        location /bulk/ {
            autoindex off;
        }

        location /hls/plain/ {
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # Key file served from tls/ directory
        location /hls.key {
            alias /opt/eec/server/tls/hls.key;
        }

        location /status {
            stub_status;
        }
    }
}
